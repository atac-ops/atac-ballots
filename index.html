<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ATAC Judging</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#F6F5F1;color:#16182B;
    font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .box{max-width:420px;padding:28px 24px;text-align:center}
  h1{font-size:20px;font-weight:500;margin:0 0 8px}
  p{color:#4A4C5E;font-size:14px;margin:0 0 16px}
  a.btn{display:inline-block;padding:12px 20px;background:#16182B;color:#fff;
    text-decoration:none;border-radius:7px;font-weight:500}
  code{display:block;margin-top:14px;padding:9px 11px;background:#fff;border:1px solid #DFDDD5;
    border-radius:6px;font-size:11px;word-break:break-all;color:#16182B}
  .err{color:#A3302B}
</style>
</head>
<body>
<div class="box" id="box">
  <h1>Opening your ballots…</h1>
  <p>One moment.</p>
</div>

<script>
// Forwards to the Apps Script ballot app, carrying the judge's token through.
//
// This page exists because some mail apps rewrite a script.google.com link on
// click and it fails with a Drive error. A link on this domain is not rewritten,
// and the browser arrives at Apps Script as a normal navigation.
//
// Only the token is passed on. Nothing is stored, logged or sent anywhere else.
var TARGET = 'https://script.google.com/macros/s/AKfycbxoHvIubv6MMjFyeKDvljiECVfcWmdO63CE8EgI8COYU14Rq_5F770B2XPjdOgubN8dYA/exec';
(function () {
  var params = new URLSearchParams(window.location.search);
  var token = (params.get('t') || '').trim();
  var box = document.getElementById('box');

  if (!TARGET || TARGET.indexOf('PUT_YOUR') === 0) {
    box.innerHTML = '<h1 class="err">Not configured</h1>' +
      '<p>Set TARGET in this page to the ballot app /exec URL.</p>';
    return;
  }
  if (!token) {
    box.innerHTML = '<h1 class="err">Link incomplete</h1>' +
      '<p>This address is missing the part that identifies you. ' +
      'Use the full link from your ATAC email, or contact ATAC for a new one.</p>';
    return;
  }

  var dest = TARGET + (TARGET.indexOf('?') === -1 ? '?' : '&') +
             't=' + encodeURIComponent(token);

  // replace(), not assign(), so Back does not bounce the judge in a loop
  window.location.replace(dest);

  // If the redirect is blocked, give them something to tap rather than a
  // blank screen.
  setTimeout(function () {
    box.innerHTML = '<h1>Tap to continue</h1>' +
      '<p>If nothing happened automatically:</p>' +
      '<a class="btn" href="' + dest + '">Open my ballots</a>' +
      '<code>' + dest + '</code>';
  }, 2500);
})();
</script>
</body>
</html>
